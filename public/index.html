<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gerenciamento.com</title>
</head>
<body>
    <h1>Sistema de Gestão e Agendamento de Lista de Tarefas</h1>
    <hr>

    <section>
        <h2>Cadastro de Usuário</h2>
        <input type="text" id="usuario-nome" placeholder="Digite o nome" required>
        <input type="email" id="usuario-email" placeholder="Digite o email" required>
        <input type="password" id="usuario-senha" placeholder="Digite a senha" required>
        <input type="text" id="usuario-cpf" placeholder="Digite o CPF" required>
        <button id="btn-usuario" type="button">Cadastrar Usuário</button>
    </section>

    <h2>Lista de Usuários</h2>
    <div id="get-usuarios">
        Carregando usuários...
    </div>

    <hr>

    <section>
        <h2>Cadastro de Tarefa</h2>
        <input type="text" id="tarefa-descricao" placeholder="Descrição da tarefa" required>
        <input type="text" id="tarefa-prazo" placeholder="Prazo" required>
        <button id="btn-tarefa" type="button">Cadastrar Tarefa</button>
    </section>

    <h2>Lista de Tarefas</h2>
    <div id="get-tarefas">
        Carregando tarefas...
    </div>

    <script src="script.js"></script>
</body>
</html>
